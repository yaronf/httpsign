on: [push, pull_request]
name: Test
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - name: Test
        run: go test ./...

  fuzz:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - name: Fuzz smoke
        # Short per-target budget (~75s total). See internal-docs/FUZZ.md.
        run: |
          set -euo pipefail
          for target in FuzzVerifyRequest FuzzVerifyViaMessage FuzzSignAndVerifyHMAC FuzzHMACViaMessage FuzzNewMessage; do
            echo "::group::fuzz $target"
            go test -run='^$' -fuzz="$target" -fuzztime=15s .
            echo "::endgroup::"
          done
