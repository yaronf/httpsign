on: [push, pull_request]
name: Test
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - name: Test
        run: go test ./...

  fuzz:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - name: Fuzz smoke
        # Short per-target budget. -fuzz is a regexp — use ^Name$ so names are not
        # substrings of each other (see internal-docs/FUZZ.md).
        run: |
          set -euo pipefail
          for target in \
            FuzzVerifyRequest \
            FuzzVerifyViaMessage \
            FuzzSignAndVerifyHMAC \
            FuzzHMACViaMessage \
            FuzzNewMessage \
            FuzzSignAndVerifyJWS \
            FuzzJWSVerifyRequest \
            FuzzSignAndVerifyMLDSA \
            FuzzInferJWSVerifier \
            FuzzNewJWSConstructors
          do
            echo "::group::fuzz $target"
            go test -run='^$' -fuzz="^${target}$" -fuzztime=15s .
            echo "::endgroup::"
          done
